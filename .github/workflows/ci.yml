name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "40 2 * * *" # Run 40 mins after nightly noir release (which happens at 2 AM UTC)

permissions:
  contents: read

env:
  REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  REF: ${{ github.head_ref || github.ref_name }}
  # The number of most recent Noir releases to test against.
  NOIR_VERSION_WINDOW: 5
  # An old release which is always tested to cover the legacy `nargo-` tarball naming.
  # This is only installed from prebuilt binaries as it can no longer be built from source.
  LEGACY_NOIR_VERSION: v0.16.0

jobs:
  noir-version-list:
    name: Query supported Noir versions
    runs-on: ubuntu-latest
    outputs:
      noir_versions: ${{ steps.get_versions.outputs.versions }}
      noir_source_versions: ${{ steps.get_versions.outputs.source_versions }}

    steps:
      - name: Query Noir releases
        id: get_versions
        run: |
          # gh returns the Noir releases in reverse chronological order so we keep the most recent ones.
          # Pre-releases are included so that release candidates are tested. Filtering on the `v` prefix
          # drops the nightly releases, which make up most of the list so we need to fetch a lot of releases.
          RECENT=$(gh release list -R noir-lang/noir --limit 1000 --json tagName,isDraft | jq -c --argjson window "$NOIR_VERSION_WINDOW" 'map(select(.isDraft | not) | .tagName | select(startswith("v"))) | .[0:$window]')

          # Fail loudly rather than silently testing fewer versions than expected.
          if [ "$(jq length <<<"$RECENT")" -ne "$NOIR_VERSION_WINDOW" ]; then
            echo "::error::expected $NOIR_VERSION_WINDOW Noir releases but found: $RECENT"
            exit 1
          fi

          VERSIONS=$(jq -c --arg legacy "$LEGACY_NOIR_VERSION" '. + ([$legacy] - .)' <<<"$RECENT")

          echo "versions=$VERSIONS"
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "source_versions=$RECENT"
          echo "source_versions=$RECENT" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}


  install:
    name: Noir ${{matrix.toolchain}} (CLI) on ${{matrix.os == 'ubuntu' && 'Linux' || matrix.os == 'macos' && 'macOS' || matrix.os == 'windows' && 'Windows' || '???'}}
    needs: [noir-version-list]
    runs-on: ${{matrix.os}}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
        toolchain: ${{ fromJson( needs.noir-version-list.outputs.noir_versions )}}
        include:
          - os: ubuntu 
            toolchain: nightly
          - os: ubuntu 
            toolchain: stable
          - os: macos 
            toolchain: nightly
          - os: macos 
            toolchain: stable
    timeout-minutes: 45
    steps:
      - name: Parse toolchain
        id: parse
        run: |
          : parse toolchain version
          if [[ $toolchain == "stable" ]]; then
            : By default, noirup installs the latest stable version
          elif [[ $toolchain == "nightly" ]]; then
            echo "toolchain="--nightly"" >> $GITHUB_OUTPUT
          else
            echo "toolchain="--version $toolchain"" >> $GITHUB_OUTPUT
          fi
        env:
          toolchain: ${{matrix.toolchain}}

      - name: Install noirup
        run: |
          curl -L $INSTALL_URL | bash
          echo "${HOME}/.nargo/bin" >> $GITHUB_PATH
        env:
          INSTALL_URL: https://raw.githubusercontent.com/${{ env.REPO }}/${{ env.REF }}/install
          NOIRUP_BIN_URL: https://raw.githubusercontent.com/${{ env.REPO }}/${{ env.REF }}/noirup
      - name: Install nargo with noirup
        run: noirup ${{steps.parse.outputs.toolchain}}
      - name: Check nargo installation
        run: nargo --version
      - name: Check noir-inspector installation
        run: |
          # Fetch the version from `nargo` as to also check the `stable` and `nightly` toolchains
          VERSION=$(nargo --version | awk -F' = ' '/nargo version/ {print $2}')
          MIN_VERSION="1.0.0-beta.3"

          version_gte() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" = "$2" ]
          }

          if version_gte "$VERSION" "$MIN_VERSION"; then
            noir-inspector --version
          fi
      - name: Check noir-profiler installation
        run: |
          # Fetch the version from `nargo` as to also check the `stable` and `nightly` toolchains
          VERSION=$(nargo --version | awk -F' = ' '/nargo version/ {print $2}')
          MIN_VERSION="1.0.0-beta.3"

          version_gte() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" = "$2" ]
          }

          if version_gte "$VERSION" "$MIN_VERSION"; then
            noir-profiler --version
          fi
      - name: Check noir-execute installation
        run: |
          # Fetch the version from `nargo` as to also check the `stable` and `nightly` toolchains
          VERSION=$(nargo --version | awk -F' = ' '/nargo version/ {print $2}')
          MIN_VERSION="1.0.0-rc.1"

          version_gte() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" = "$2" ]
          }

          if version_gte "$VERSION" "$MIN_VERSION"; then
            noir-execute --version
          fi

  install-source:
    name: Noir ${{matrix.version}} (from source) on ${{matrix.os == 'ubuntu' && 'Linux' || matrix.os == 'macos' && 'macOS' || matrix.os == 'windows' && 'Windows' || '???'}}
    needs: [noir-version-list]
    runs-on: ${{matrix.os}}-latest
    strategy:
      fail-fast: false
      matrix:
        # Installing from source can technically target any commit.
        # However, we only guarantee that noirup will build release commits.
        os: [ubuntu, macos]
        version: ${{ fromJson( needs.noir-version-list.outputs.noir_source_versions )}}
    timeout-minutes: 45
    steps:
      - name: Install noirup
        run: |
          curl -L $INSTALL_URL | bash
          echo "${HOME}/.nargo/bin" >> $GITHUB_PATH
        env:
          INSTALL_URL: https://raw.githubusercontent.com/${{ env.REPO }}/${{ env.REF }}/install
          NOIRUP_BIN_URL: https://raw.githubusercontent.com/${{ env.REPO }}/${{ env.REF }}/noirup

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ matrix.version }}

      - name: Install nargo from source with noirup
        run: noirup $toolchain
        env:
          toolchain: -b tags/${{matrix.version}}
      - name: Check nargo installation
        run: nargo --version
      - name: Check noir-inspector installation
        run: |
          # Fetch the version from `nargo` as to also check the `stable` and `nightly` toolchains
          VERSION=$(nargo --version | awk -F' = ' '/nargo version/ {print $2}')
          MIN_VERSION="1.0.0-beta.3"

          version_gte() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" = "$2" ]
          }

          if version_gte "$VERSION" "$MIN_VERSION"; then
            noir-inspector --version
          fi
      - name: Check noir-profiler installation
        run: |
          # Minimum version which began releasing binaries for the `noir-profiler`
          # Account for the extra `v` that prefixes "${{matrix.version}}"
          MIN_VERSION="v1.0.0-beta.3"

          version_gte() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" = "$2" ]
          }

          if version_gte ${{matrix.version}} "$MIN_VERSION"; then
            noir-profiler --version
          fi
      - name: Check noir-execute installation
        run: |
          # Minimum version which began releasing binaries for `noir-execute`
          # Account for the extra `v` that prefixes "${{matrix.version}}"
          MIN_VERSION="v1.0.0-rc.1"

          version_gte() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" = "$2" ]
          }

          if version_gte ${{matrix.version}} "$MIN_VERSION"; then
            noir-execute --version
          fi

  install-action:
    name: Noir ${{matrix.toolchain}} (GH action) on ${{matrix.os == 'ubuntu' && 'Linux' || matrix.os == 'macos' && 'macOS' || matrix.os == 'windows' && 'Windows' || '???'}}
    needs: [noir-version-list]
    runs-on: ${{matrix.os}}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
        toolchain: ${{ fromJson( needs.noir-version-list.outputs.noir_versions )}}
        include:
          - os: ubuntu 
            toolchain: nightly
          - os: ubuntu 
            toolchain: stable
          - os: macos 
            toolchain: nightly
          - os: macos 
            toolchain: stable
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v3
      - uses: ./
        name: Run noir-lang/noirup
        id: version
        with:
          toolchain: ${{matrix.toolchain}}
      - run: nargo --version
      - run: nargo new project
      - run: nargo check
        working-directory: ./project
      - run: nargo compile
        working-directory: ./project
      - run: nargo test
        working-directory: ./project
      - name: Check noir-inspector installation
        run: |
          # Fetch the version from `nargo` as to also check the `stable` and `nightly` toolchains
          VERSION=$(nargo --version | awk -F' = ' '/nargo version/ {print $2}')
          MIN_VERSION="1.0.0-beta.3"

          version_gte() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" = "$2" ]
          }

          if version_gte "$VERSION" "$MIN_VERSION"; then
            noir-inspector --version
          fi
      - name: Check noir-profiler installation
        working-directory: ./project
        run: |
          VERSION=$(nargo --version | awk -F' = ' '/nargo version/ {print $2}')
          MIN_VERSION="1.0.0-beta.3"

          version_gte() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" = "$2" ]
          }

          if version_gte "$VERSION" "$MIN_VERSION"; then
            noir-profiler --version
            noir-profiler opcodes -a ./target/project.json -o ./target
          fi
      - name: Check noir-execute installation
        run: |
          VERSION=$(nargo --version | awk -F' = ' '/nargo version/ {print $2}')
          MIN_VERSION="1.0.0-rc.1"

          version_gte() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" = "$2" ]
          }

          if version_gte "$VERSION" "$MIN_VERSION"; then
            noir-execute --version
          fi
